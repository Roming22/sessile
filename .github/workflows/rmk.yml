name: Build RMK firmware
on:
  workflow_dispatch:
  push:
    paths:
      - "rmk/**"
      - ".github/workflows/rmk.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: cargo-bins/cargo-binstall@main
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rmk
          cache-on-failure: true
      - name: Install flip-link, cargo-make, and cargo-binutils
        run: cargo binstall cargo-make cargo-hex-to-uf2 flip-link cargo-binutils -y
      - name: Add target
        working-directory: ./rmk
        run: rustup show && rustup target add thumbv7em-none-eabihf
      - name: Build uf2 firmware
        working-directory: ./rmk
        run: cargo make uf2 --release
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: rmk/*.uf2

  release:
    runs-on: ubuntu-slim
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    needs: build
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: firmware
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.uf2"
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

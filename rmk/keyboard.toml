# Documentation: https://haobogu.github.io/rmk/keyboard_configuration.html
[keyboard]
name = "sessile"
product_name = "sessile"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "Octule"
board = "XIAO BLE"

[matrix]
# Input and output pins are mandatory
# NFC: GPIO 0.9 and 0.10
input_pins = ["P1_12", "P0_10", "P0_09", "P1_11"]
output_pins = ["P0_02", "P1_15", "P0_03", "P1_14", "P0_28", "P1_13", "P0_29"]
# WARNING: Currently row2col/col2row is set in RMK's feature gate, row2col config here is valid ONLY when you're using cloud compilation
row2col = true

[layout]
# WARNING: Currently row2col/col2row is set in RMK's feature gate, configs here do nothing actually
# row2col = true
rows = 7
cols = 4
layers = 4
keymap = [
    [
        ["__", "__", "__", "__"],                               ["__", "__", "__", "__"],
        ["F", "MT(P, LCtrl)", "MT(C, LAlt)", "MT(R, LShift)"],  ["MT(N, RShift)", "MT(H, RAlt)", "MT(L, RCtrl)","M"],
        ["D", "LT(3, S)", "A", "E"],                            ["I", "O", "LT(3, T)", "G"],
        ["LT(2, Space)", "Tab", "LGui", "LT(1, Enter)"]
    ],
    [
        ["__", "__", "__", "__"],                   ["KbVolumeDown", "KbMute", "KbVolumeUp", "Backspace"],
        ["Escape", "Grave", "Backslash", "Minus"],  ["Minus", "Slash", "Equal", "PageUp"],
        ["Kc2", "Kc3", "Kc4", "Kc7"],               ["Dot", "Comma", "Quote", "PageDown"],
        ["__", "__", "__", "__"]
    ],
    [
        ["__", "__", "__", "__"], 		["__", "__", "__", "__"],
        ["__", "F1", "F2", "F3"],    	["Kc7", "Kc8", "Kc9", "__"],
        ["__", "F10", "F11", "F12"], 	["Kc0", "Kc1", "Kc2", "__"],
        ["__", "__", "__", "__"]
    ],
    [
        ["__", "__", "__", "__"], 		            ["__", "__", "__", "__"],
        ["__", "Escape", "PageUp", "PrintScreen"],  ["Backspace", "UP", "Delete", "__"],
        ["__", "Home", "PageDown", "End"], 	        ["Left", "Down", "Right", "__"],
        ["__", "__", "__", "__"]
    ],
]

[light]
# All light pins are high-active by default, uncomment if you want it to be low-active
capslock.pin = "P0_30"
capslock.low_active = true
# scrolllock.pin = "PA3"
# scrolllock.low_active = true
# Just ignore if no light pin is used for it
# numslock.pin = "PA5"
# numslock.low_active = true

[storage]
clear_storage = true

[ble]
enabled = true
# vddh has an internal voltage divider
battery_adc_pin = "vddh"
# Or
# battery_adc_pin = "P0_04"
# adc_divider_measured = 2000
# adc_divider_total = 2806
charge_state.pin = "P0_14"
charge_state.low_active = false
# charge_led.pin = "P1_06"
# charge_led.low_active = false

[behavior]
# Enable HRM 
tap_hold = { enable_hrm = true, prior_idle_time = "200ms", hold_timeout = "280ms", post_wait_time = "10ms"}
# # Disable HRM, you can safely ignore any fields if you don't want to change them
# # tap_hold = { enable_hrm = false, hold_timeout = "200ms" }
